<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>자동 새 창 차단</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>자동 새 창 차단</h1>
  <p>사이트가 자동으로 여는 팝업을 크롬의 기본 차단 기능으로 막습니다.</p>
  <p id="status" role="status" aria-live="polite">설정을 확인하는 중…</p>
  <button id="toggle" type="button" disabled>잠시 기다려 주세요</button>
  <p class="note">차단을 끄면 이 확장 프로그램의 설정을 해제하고 기존 크롬 설정으로 돌아갑니다. 사이트별 예외나 다른 확장 프로그램의 설정에 따라 결과가 달라질 수 있습니다.</p>
  <p class="note">직접 클릭한 링크는 보통 허용됩니다. 다른 프로그램이나 확장 프로그램이 여는 창은 차단하지 않습니다.</p>
</body>
</html>
