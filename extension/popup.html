<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>자동 새 창 차단</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>자동 새 창 차단</h1>
  <p>직접 선택한 링크는 유지하고, 의도하지 않은 스크립트 팝업을 차단합니다.</p>
  <p id="status" role="status" aria-live="polite">설정을 확인하는 중…</p>
  <button id="toggle" type="button" disabled>잠시 기다려 주세요</button>
  <p><label><input id="overlays" type="checkbox" disabled> 광고 레이어 숨기기</label></p>
  <p><button id="pick-layer" type="button">광고 레이어 직접 선택</button></p>
  <p><button id="reset-layers" type="button">이 사이트의 선택 차단 초기화</button></p>
  <p class="note">자동 차단이 놓친 큰 광고 덮개는 직접 선택하세요. 같은 사이트에서 다시 나타나면 숨깁니다. 잘못 선택하면 초기화하세요.</p>
  <p class="note">광고로 명확히 식별되는 큰 덮개만 숨깁니다. 일반 메뉴·로그인 창은 유지합니다. 일부 광고는 식별하지 못할 수 있습니다.</p>
  <p class="note">로그인·결제 버튼으로 여는 창은 허용합니다. 정상 동작이 막히면 차단을 잠시 끄세요. 업데이트 후 사이트를 새로고침하세요.</p>
</body>
</html>
